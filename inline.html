<!doctype html><meta charset="utf-8"><title>text-ascii prototype</title>
<style>
body{margin:0;background:#111;color:#ddd;font:13px system-ui;display:flex;height:100vh}
#side{width:290px;overflow:auto;padding:12px;box-sizing:border-box;border-right:1px solid #333;flex:none}
#side label{display:block;margin:9px 0 2px}
#side input[type=range],#side select,#side textarea{width:100%;box-sizing:border-box}
#side .row{display:flex;gap:8px;align-items:center}
textarea{height:64px;font:11px monospace;background:#1b1b1b;color:#ddd;border:1px solid #333}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
canvas{max-width:100%;max-height:100%}
output{color:#888}
</style>
<div id="side">
<b>text-ascii prototype</b>
<label>Image</label><select id="img"></select>
<label>Tilt <output id="o_tilt"></output></label><input id="tilt" type="range" min="0" max="75" value="0">
<div class="row"><input id="sweep" type="checkbox"><span>Sweep tilt 0 to max (8 s loop)</span></div>
<label>Perspective strength <output id="o_persp"></output></label><input id="persp" type="range" min="3" max="30" value="10">
<label>Advance</label><select id="mode">
<option value="cols">Columns: letters flow down each column</option>
<option value="rows">Rows: one running text per band</option>
<option value="cell">Per-cell: each cell steps its own text</option>
<option value="crawl">Crawl: whole lines scroll to front</option></select>
<div class="row"><input id="rev" type="checkbox"><span>Reverse (away from front)</span></div>
<label>Speed, letters/s <output id="o_speed"></output></label><input id="speed" type="range" min="0" max="30" value="6">
<label>Cell size <output id="o_cell"></output></label><input id="cell" type="range" min="10" max="40" value="18">
<label>Tone bands <output id="o_bands"></output></label><input id="bands" type="range" min="1" max="3" value="3">
<label>Blank below tone <output id="o_blank"></output></label><input id="blank" type="range" min="0" max="40" value="6">
<label>Colour</label><select id="cmode"><option value="mono">Mono (fg by tone)</option><option value="src">Source colour</option></select>
<div class="row"><span>bg</span><input id="bg" type="color" value="#0b0b0b"><span>fg</span><input id="fg" type="color" value="#f2f2f2"></div>
<label>Text for darkest band</label><textarea id="t0"></textarea>
<label>Text for middle band</label><textarea id="t1"></textarea>
<label>Text for lightest band</label><textarea id="t2"></textarea>
</div>

const cv=$('cv'), ctx=cv.getContext('2d');
$('t0').value="Call me Ishmael. Some years ago—never mind how long precisely—having little or no money in my purse, and nothing particular to interest me on shore, I thought I would sail about a little and see the watery part of the world. ";
$('t1').value="It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife. However little known the feelings or views of such a man may be on his first entering a neighbourhood, this truth is so well fixed in the minds of the surrounding families. ";
$('t2').value="Alice was beginning to get very tired of sitting by her sister on the bank, and of having nothing to do: once or twice she had peeped into the book her sister was reading, but it had no pictures or conversations in it. ";

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function prepText(){bodies=[0,1,2].map(i=>{const s=Array.from($('t'+i).value.replace(/\s+/g,' ').trim()+' ');return s.length>1?s:[' ']});}
function loadImg(){const im=new Image();im.onload=()=>{window.IM=im;resample()};im.src=IMGS[$('img').value-1];}
function resample(){
  if(!window.IM)return;
  const cs=+$('cell').value; cw=cs*0.6; chh=cs;
  cols=Math.floor(W/cw); rows=Math.floor(H/chh);
  const t=document.createElement('canvas'); t.width=cols; t.height=rows; const tc=t.getContext('2d'); tc.imageSmoothingEnabled=true;
  const im=IM, pa=(cols*cw)/(rows*chh); let sw=im.width, sh=im.height;
  if(sw/sh>pa) sw=sh*pa; else sh=sw/pa;
  tc.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,cols,rows);
  const d=tc.getImageData(0,0,cols,rows).data, n=cols*rows;
  lum=new Float32Array(n); css=new Array(n); let mn=1,mx=0;
  for(let i=0;i<n;i++){const r=d[i*4],g=d[i*4+1],b=d[i*4+2];const l=(.299*r+.587*g+.114*b)/255;lum[i]=l;if(l<mn)mn=l;if(l>mx)mx=l;css[i]=`rgb(${r},${g},${b})`;}

  const R=rng(7); colStart=new Int32Array(cols); for(let c=0;c<cols;c++)colStart[c]=Math.floor(R()*1e6);

  rebuild();
}
function rebuild(){
  if(!lum)return; const nb=+$('bands').value, bl=$('blank').value/100, n=cols*rows;
  band=new Int8Array(n); rankRow=new Int32Array(n); const cnt=[0,0,0];
  for(let i=0;i<n;i++){const l=lum[i]; if(l<bl){band[i]=-1;continue;} const b=Math.min(nb-1,Math.floor(l*nb)); band[i]=b; rankRow[i]=cnt[b]++;}
  dirty=true;
}
function draw(step){
  const phi=$('tilt').value*Math.PI/180, cP=Math.cos(phi), sP=Math.sin(phi), f=H*(+$('persp').value/10);

  const fg=$('fg').value, bg=$('bg').value; ctx.fillStyle=fg;

  for(let r=0;r<rows;r++){

      else if(mode==='rows') k=rankRow[i]+dir*step;
      else if(mode==='cell') k=cellStart[i]+dir*step;
      else k=(r-dir*lineStep)*cols+c;

      ctx.fillText(ch,0,0);

  }

['cell'].forEach(id=>$(id).addEventListener('input',resample));
['bands','blank'].forEach(id=>$(id).addEventListener('input',rebuild));

['tilt','persp','speed','mode','rev','cmode','bg','fg'].forEach(id=>$(id).addEventListener('input',()=>dirty=true));
function out(){['tilt','persp','speed','cell','bands','blank'].forEach(id=>$('o_'+id).textContent=$(id).value);}
prepText(); out(); loadImg();
function tick(now){
  if($('sweep').checked){const p=(now/8000)%1; $('tilt').value=Math.round(75*(0.5-0.5*Math.cos(p*2*Math.PI))); dirty=true;}

}
